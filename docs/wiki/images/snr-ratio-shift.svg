<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540">
  <rect width="820" height="540" fill="#262626"/>

  <!-- Title + equation -->
  <text x="410" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FDE6A0">snr_ratio_shift -- pulse-vs-gap SNR gate</text>
  <text x="410" y="54" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#FBEB24">pass iff  sum_pulse &gt; ( sum_gap &lt;&lt; s )</text>
  <text x="410" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0" opacity="0.75">i.e. sum_pulse &gt; sum_gap * 2^s -- higher s raises the bar, demanding a larger SNR margin</text>

  <!-- Plot area: x [90,760] y [110,430] -->
  <!-- Accept shading above default s=0 line (above y=x) -->
  <polygon points="90,430 90,110 760,110" fill="#A3E835" opacity="0.07"/>

  <!-- Axis lines -->
  <line x1="90"  y1="110" x2="90"  y2="430" stroke="#FDE6A0" stroke-width="1" opacity="0.6"/>
  <line x1="90"  y1="430" x2="760" y2="430" stroke="#FDE6A0" stroke-width="1" opacity="0.6"/>

  <!-- Ticks -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.8">
    <line x1="90"  y1="430" x2="90"  y2="435" stroke="#FDE6A0"/>
    <text x="90"  y="450" text-anchor="middle">0</text>
    <line x1="224" y1="430" x2="224" y2="435" stroke="#FDE6A0"/>
    <text x="224" y="450" text-anchor="middle">20</text>
    <line x1="358" y1="430" x2="358" y2="435" stroke="#FDE6A0"/>
    <text x="358" y="450" text-anchor="middle">40</text>
    <line x1="492" y1="430" x2="492" y2="435" stroke="#FDE6A0"/>
    <text x="492" y="450" text-anchor="middle">60</text>
    <line x1="626" y1="430" x2="626" y2="435" stroke="#FDE6A0"/>
    <text x="626" y="450" text-anchor="middle">80</text>
    <line x1="760" y1="430" x2="760" y2="435" stroke="#FDE6A0"/>
    <text x="760" y="450" text-anchor="middle">100</text>

    <line x1="85" y1="430" x2="90" y2="430" stroke="#FDE6A0"/>
    <text x="80" y="434" text-anchor="end">0</text>
    <line x1="85" y1="366" x2="90" y2="366" stroke="#FDE6A0"/>
    <text x="80" y="370" text-anchor="end">20</text>
    <line x1="85" y1="302" x2="90" y2="302" stroke="#FDE6A0"/>
    <text x="80" y="306" text-anchor="end">40</text>
    <line x1="85" y1="238" x2="90" y2="238" stroke="#FDE6A0"/>
    <text x="80" y="242" text-anchor="end">60</text>
    <line x1="85" y1="174" x2="90" y2="174" stroke="#FDE6A0"/>
    <text x="80" y="178" text-anchor="end">80</text>
    <line x1="85" y1="110" x2="90" y2="110" stroke="#FDE6A0"/>
    <text x="80" y="114" text-anchor="end">100</text>
  </g>

  <!-- Axis labels -->
  <text x="425" y="478" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#FDE6A0">sum_gap (arbitrary units)</text>
  <text x="30" y="270" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#FDE6A0" transform="rotate(-90, 30, 270)">sum_pulse</text>

  <!-- Shift boundary lines; scale: x=90+v*6.7, y=430-v*3.2 -->
  <!-- s=0: sum_pulse > sum_gap, slope 1: (0,0)->(100,100) -->
  <line x1="90" y1="430" x2="760" y2="110" stroke="#A3E835" stroke-width="2.2"/>
  <text x="765" y="113" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="bold" fill="#A3E835">s=0 (default)</text>

  <!-- s=1: sum_pulse > 2*sum_gap; line reaches y=100 at v=50 -> x = 90+50*6.7 = 425 -->
  <line x1="90" y1="430" x2="425" y2="110" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="432" y="113" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#60A5FA">s=1</text>

  <!-- s=2: slope 4; v at y=100 is 25 -> x = 90+25*6.7 = 257.5 -->
  <line x1="90" y1="430" x2="257.5" y2="110" stroke="#C084FC" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="264" y="113" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#C084FC">s=2</text>

  <!-- s=3: slope 8; v at y=100 is 12.5 -> x = 90+12.5*6.7 = 173.75 -->
  <line x1="90" y1="430" x2="173.75" y2="110" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="179" y="113" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#EF4444">s=3 (strict)</text>

  <!-- Region labels -->
  <text x="130" y="155" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-style="italic" fill="#A3E835" opacity="0.85">ACCEPT (high pulse vs gap)</text>
  <text x="540" y="410" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-style="italic" fill="#FDE6A0" opacity="0.5">REJECT (noisy band)</text>

  <!-- Example candidate points; x = 90+v*6.7, y = 430-v*3.2 -->
  <!-- A: clean (gap=12, pulse=78) -> x=170, y=180 -->
  <circle cx="170" cy="180" r="5" fill="#FDE6A0" stroke="#262626" stroke-width="1.5"/>
  <text x="180" y="176" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">A  clean preamble, low-noise band</text>
  <text x="180" y="190" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.6">passes s=0,1,2 (fails s=3 only)</text>

  <!-- B: noisy-band (gap=38, pulse=55) -> x=344, y=254 -->
  <circle cx="344" cy="254" r="5" fill="#FDE6A0" stroke="#262626" stroke-width="1.5"/>
  <text x="354" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">B  real preamble in noisy RF</text>
  <text x="354" y="264" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.6">passes s=0 only -- dropped if you raise s</text>

  <!-- C: FRUIT co-channel (gap=55, pulse=70) -> x=459, y=206 -->
  <circle cx="459" cy="206" r="5" fill="#FDE6A0" stroke="#262626" stroke-width="1.5"/>
  <text x="469" y="202" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">C  FRUIT overlap, strong pulse + strong gap</text>
  <text x="469" y="216" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.6">passes s=0 only</text>

  <!-- D: near-parity noise (gap=40, pulse=42) -> x=358, y=296 -->
  <circle cx="358" cy="296" r="5" fill="#F87171" stroke="#262626" stroke-width="1.5"/>
  <text x="368" y="292" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#F87171">D  noise-driven false (pulse &#8776; gap)</text>
  <text x="368" y="306" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#F87171" opacity="0.7">scrapes past s=0; s&#8805;1 kills it</text>

  <!-- Caption block -->
  <rect x="30" y="498" width="760" height="34" fill="#1b1b1b" stroke="#FDE6A0" stroke-width="0.3" opacity="0.85"/>
  <text x="40" y="515" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">Raising snr_ratio_shift rejects marginal candidates (noisy band, FRUIT, near-noise) at the cost of losing real preambles received in</text>
  <text x="40" y="528" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">dirty RF. Useful when the detector is overwhelmed by false candidates in dense traffic; costs weak-signal recall.</text>
</svg>
