<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540">
  <rect width="820" height="540" fill="#262626"/>

  <!-- Title + equation -->
  <text x="410" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FDE6A0">quiet_score_shift -- quiet-zone contrast gate</text>
  <text x="410" y="54" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#F59E0B">pass iff  quiet_score &gt; ( sum_pulse &gt;&gt; s )</text>
  <text x="410" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0" opacity="0.75">i.e. quiet_score &gt; sum_pulse / 2^s -- higher s lowers the bar, admitting more candidates</text>

  <!-- Plot area: x [90,760] y [110,430] -->
  <!-- Accept shading for default s=1 region -->
  <polygon points="90,410 90,110 760,110 760,260" fill="#A3E835" opacity="0.07"/>

  <!-- Grid -->
  <line x1="90"  y1="110" x2="90"  y2="430" stroke="#FDE6A0" stroke-width="1" opacity="0.6"/>
  <line x1="90"  y1="430" x2="760" y2="430" stroke="#FDE6A0" stroke-width="1" opacity="0.6"/>

  <!-- Axis ticks and labels; sum_pulse 0..100 maps to x 90..760 (step 20 => 134 px) -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.8">
    <line x1="90"  y1="430" x2="90"  y2="435" stroke="#FDE6A0"/>
    <text x="90"  y="450" text-anchor="middle">0</text>
    <line x1="224" y1="430" x2="224" y2="435" stroke="#FDE6A0"/>
    <text x="224" y="450" text-anchor="middle">20</text>
    <line x1="358" y1="430" x2="358" y2="435" stroke="#FDE6A0"/>
    <text x="358" y="450" text-anchor="middle">40</text>
    <line x1="492" y1="430" x2="492" y2="435" stroke="#FDE6A0"/>
    <text x="492" y="450" text-anchor="middle">60</text>
    <line x1="626" y1="430" x2="626" y2="435" stroke="#FDE6A0"/>
    <text x="626" y="450" text-anchor="middle">80</text>
    <line x1="760" y1="430" x2="760" y2="435" stroke="#FDE6A0"/>
    <text x="760" y="450" text-anchor="middle">100</text>

    <!-- y ticks: quiet_score 0..100 maps to y 430..110 (step 20 => 64 px) -->
    <line x1="85" y1="430" x2="90" y2="430" stroke="#FDE6A0"/>
    <text x="80" y="434" text-anchor="end">0</text>
    <line x1="85" y1="366" x2="90" y2="366" stroke="#FDE6A0"/>
    <text x="80" y="370" text-anchor="end">20</text>
    <line x1="85" y1="302" x2="90" y2="302" stroke="#FDE6A0"/>
    <text x="80" y="306" text-anchor="end">40</text>
    <line x1="85" y1="238" x2="90" y2="238" stroke="#FDE6A0"/>
    <text x="80" y="242" text-anchor="end">60</text>
    <line x1="85" y1="174" x2="90" y2="174" stroke="#FDE6A0"/>
    <text x="80" y="178" text-anchor="end">80</text>
    <line x1="85" y1="110" x2="90" y2="110" stroke="#FDE6A0"/>
    <text x="80" y="114" text-anchor="end">100</text>
  </g>

  <!-- Axis labels -->
  <text x="425" y="478" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#FDE6A0">sum_pulse (arbitrary units)</text>
  <text x="30" y="270" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#FDE6A0" transform="rotate(-90, 30, 270)">quiet_score</text>

  <!-- Shift boundary lines -->
  <!-- s=0: slope 1, line from (0,0)=(90,430) to (100,100)=(760,110) -->
  <line x1="90" y1="430" x2="760" y2="110" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="765" y="113" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#EF4444">s=0 (strict)</text>

  <!-- s=1: slope 0.5, endpoint y=50 => plot y = 430 - 0.5*320 = 270 -->
  <line x1="90" y1="430" x2="760" y2="270" stroke="#A3E835" stroke-width="2.2"/>
  <text x="765" y="273" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="bold" fill="#A3E835">s=1 (default)</text>

  <!-- s=2: slope 0.25, endpoint y=25 => plot y = 430 - 0.25*320 = 350 -->
  <line x1="90" y1="430" x2="760" y2="350" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="765" y="353" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#60A5FA">s=2</text>

  <!-- s=3: slope 0.125, endpoint y=12.5 => plot y = 430 - 0.125*320 = 390 -->
  <line x1="90" y1="430" x2="760" y2="390" stroke="#C084FC" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="765" y="393" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#C084FC">s=3 (loose)</text>

  <!-- Region label above default line -->
  <text x="300" y="200" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-style="italic" fill="#A3E835" opacity="0.85">ACCEPT (above default line)</text>
  <text x="520" y="410" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-style="italic" fill="#FDE6A0" opacity="0.5">REJECT (below all lines)</text>

  <!-- Example candidate points; val->(x,y): x = 90 + v*6.7; y = 430 - v*3.2 -->
  <!-- A: clean preamble (pulse=70, score=55) -->
  <circle cx="559" cy="254" r="5" fill="#FDE6A0" stroke="#262626" stroke-width="1.5"/>
  <text x="568" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">A  clean preamble</text>
  <text x="568" y="264" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.6">passes s=0,1,2,3</text>

  <!-- B: one-zone FRUIT (pulse=65, score=22) -->
  <circle cx="526" cy="360" r="5" fill="#FDE6A0" stroke="#262626" stroke-width="1.5"/>
  <text x="413" y="356" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">B  one noisy quiet-zone</text>
  <text x="413" y="370" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.6">fails s=0,1; passes s=2,3</text>

  <!-- C: weak real (pulse=25, score=9) -->
  <circle cx="258" cy="401" r="5" fill="#FDE6A0" stroke="#262626" stroke-width="1.5"/>
  <text x="130" y="397" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">C  weak real preamble</text>
  <text x="130" y="411" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FDE6A0" opacity="0.6">fails s=0,1; passes s=2,3</text>

  <!-- D: near-noise (pulse=45, score=3) -->
  <circle cx="392" cy="420" r="5" fill="#F87171" stroke="#262626" stroke-width="1.5"/>
  <text x="402" y="416" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#F87171">D  near-noise false</text>
  <text x="402" y="430" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#F87171" opacity="0.7">rejected until s=4; avoid loosening this far</text>

  <!-- Caption block -->
  <rect x="30" y="498" width="760" height="34" fill="#1b1b1b" stroke="#FDE6A0" stroke-width="0.3" opacity="0.85"/>
  <text x="40" y="515" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">Raising quiet_score_shift admits real preambles with one contaminated quiet zone (FRUIT / multipath) and weak-SNR signals,</text>
  <text x="40" y="528" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FDE6A0">but each step down also pulls in more noise-driven false candidates. The useful operating range is typically s = 1..3.</text>
</svg>
