<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#fcfbf7"/>

  <text x="56" y="44" font-family="monospace" font-size="26" fill="#111827">AD8313 / ADC Calibration</text>
  <text x="56" y="70" font-family="monospace" font-size="14" fill="#4b5563">Old LUT anchors vs. new measured transfer curve at 1090 MHz CW.</text>

  <rect x="70" y="96" width="960" height="430" rx="8" fill="#ffffff" stroke="#d1d5db"/>

  <text x="430" y="122" font-family="monospace" font-size="16" fill="#111827">ADC code to injected dBm</text>

  <!-- Plot area -->
  <rect x="160" y="140" width="820" height="320" fill="#fffefb" stroke="#e5e7eb"/>

  <!-- Horizontal grid: -100 .. -10 in 10 dB steps -->
  <line x1="160" y1="460" x2="980" y2="460" stroke="#9ca3af" stroke-width="1"/>
  <line x1="160" y1="424.44" x2="980" y2="424.44" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="388.89" x2="980" y2="388.89" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="353.33" x2="980" y2="353.33" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="317.78" x2="980" y2="317.78" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="282.22" x2="980" y2="282.22" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="246.67" x2="980" y2="246.67" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="211.11" x2="980" y2="211.11" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="175.56" x2="980" y2="175.56" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="160" y1="140" x2="980" y2="140" stroke="#9ca3af" stroke-width="1"/>

  <!-- Vertical grid: 0x900 .. 0xA60 -->
  <line x1="160" y1="140" x2="160" y2="460" stroke="#9ca3af" stroke-width="1"/>
  <line x1="262.5" y1="140" x2="262.5" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="365" y1="140" x2="365" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="467.5" y1="140" x2="467.5" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="570" y1="140" x2="570" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="672.5" y1="140" x2="672.5" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="775" y1="140" x2="775" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="877.5" y1="140" x2="877.5" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="980" y1="140" x2="980" y2="460" stroke="#9ca3af" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="122" y="464" font-family="monospace" font-size="13" fill="#374151">-100</text>
  <text x="130" y="428" font-family="monospace" font-size="13" fill="#374151">-90</text>
  <text x="130" y="393" font-family="monospace" font-size="13" fill="#374151">-80</text>
  <text x="130" y="357" font-family="monospace" font-size="13" fill="#374151">-70</text>
  <text x="130" y="322" font-family="monospace" font-size="13" fill="#374151">-60</text>
  <text x="130" y="286" font-family="monospace" font-size="13" fill="#374151">-50</text>
  <text x="130" y="251" font-family="monospace" font-size="13" fill="#374151">-40</text>
  <text x="130" y="215" font-family="monospace" font-size="13" fill="#374151">-30</text>
  <text x="130" y="180" font-family="monospace" font-size="13" fill="#374151">-20</text>
  <text x="138" y="144" font-family="monospace" font-size="13" fill="#374151">-10</text>

  <text x="148" y="486" font-family="monospace" font-size="13" fill="#374151">0x900</text>
  <text x="250" y="486" font-family="monospace" font-size="13" fill="#374151">0x920</text>
  <text x="352" y="486" font-family="monospace" font-size="13" fill="#374151">0x940</text>
  <text x="455" y="486" font-family="monospace" font-size="13" fill="#374151">0x960</text>
  <text x="557" y="486" font-family="monospace" font-size="13" fill="#374151">0x980</text>
  <text x="660" y="486" font-family="monospace" font-size="13" fill="#374151">0x9A0</text>
  <text x="762" y="486" font-family="monospace" font-size="13" fill="#374151">0x9C0</text>
  <text x="865" y="486" font-family="monospace" font-size="13" fill="#374151">0x9E0</text>
  <text x="967" y="486" font-family="monospace" font-size="13" fill="#374151">0xA00+</text>

  <text x="810" y="516" font-family="monospace" font-size="14" fill="#374151">FPGA ADC code</text>
  <text x="38" y="332" font-family="monospace" font-size="14" fill="#374151" transform="rotate(-90 38,332)">Injected power at detector input (dBm)</text>

  <!-- Old curve -->
  <polyline fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"
    points="189.0,317.78 333.3,282.22 513.4,246.67 684.7,211.11 849.8,175.56 865.2,170.22"/>
  <circle cx="189.0" cy="317.78" r="4.5" fill="#94a3b8"/>
  <circle cx="333.3" cy="282.22" r="4.5" fill="#94a3b8"/>
  <circle cx="513.4" cy="246.67" r="4.5" fill="#94a3b8"/>
  <circle cx="684.7" cy="211.11" r="4.5" fill="#94a3b8"/>
  <circle cx="849.8" cy="175.56" r="4.5" fill="#94a3b8"/>
  <circle cx="865.2" cy="170.22" r="4.5" fill="#94a3b8"/>

  <!-- New measured curve -->
  <polyline fill="none" stroke="#1d4ed8" stroke-width="4"
    points="180.0,424.44 182.8,388.89 182.8,353.33 185.7,317.78 220.8,282.22 305.3,246.67 406.5,211.11 497.4,175.56 517.9,170.22"/>
  <circle cx="180.0" cy="424.44" r="5.5" fill="#1d4ed8"/>
  <circle cx="182.8" cy="388.89" r="5.5" fill="#1d4ed8"/>
  <circle cx="182.8" cy="353.33" r="5.5" fill="#1d4ed8"/>
  <circle cx="185.7" cy="317.78" r="5.5" fill="#1d4ed8"/>
  <circle cx="220.8" cy="282.22" r="5.5" fill="#1d4ed8"/>
  <circle cx="305.3" cy="246.67" r="5.5" fill="#1d4ed8"/>
  <circle cx="406.5" cy="211.11" r="5.5" fill="#1d4ed8"/>
  <circle cx="497.4" cy="175.56" r="5.5" fill="#1d4ed8"/>
  <circle cx="517.9" cy="170.22" r="5.5" fill="#1d4ed8"/>

  <!-- Annotations -->
  <text x="536" y="168" font-family="monospace" font-size="13" fill="#1e3a8a">new top end: 0xA57 @ -18.5 dBm</text>
  <text x="322" y="243" font-family="monospace" font-size="13" fill="#1e3a8a">0x96A @ -50 dBm</text>
  <text x="205" y="309" font-family="monospace" font-size="13" fill="#1e3a8a">0x928 @ -60 dBm</text>
  <text x="195" y="370" font-family="monospace" font-size="13" fill="#1e3a8a">-80/-90/-100 all collapse near 0x904</text>
  <text x="344" y="278" font-family="monospace" font-size="13" fill="#64748b">old LUT thought this region was still about -50 to -60 dBm</text>

  <!-- Delta panel -->
  <rect x="70" y="552" width="960" height="150" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="430" y="578" font-family="monospace" font-size="16" fill="#111827">Error at the weak end</text>
  <text x="98" y="608" font-family="monospace" font-size="14" fill="#374151">Old LUT floor:</text>
  <text x="250" y="608" font-family="monospace" font-size="14" fill="#64748b">0x90D was treated like about -60.5 dBm.</text>
  <text x="98" y="634" font-family="monospace" font-size="14" fill="#374151">New measured floor:</text>
  <text x="250" y="634" font-family="monospace" font-size="14" fill="#1e3a8a">0x904 is already the practical floor; -80 dBm and weaker do not separate.</text>
  <text x="98" y="660" font-family="monospace" font-size="14" fill="#374151">Implication:</text>
  <text x="250" y="660" font-family="monospace" font-size="14" fill="#111827">the old LUT was about 8-10 dB too aggressive near the low end and zeroed weak packets too early.</text>

  <!-- Legend -->
  <line x1="740" y1="604" x2="800" y2="604" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="812" y="609" font-family="monospace" font-size="14" fill="#374151">old LUT anchors</text>
  <line x1="740" y1="636" x2="800" y2="636" stroke="#1d4ed8" stroke-width="4"/>
  <text x="812" y="641" font-family="monospace" font-size="14" fill="#374151">new measured curve</text>
</svg>
