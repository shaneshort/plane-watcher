{{define "receiver_state"}}<div class="pw-stat-grid">{{range .Stats}}
  <div class="pw-stat">
    <div class="pw-stat-label">{{.Label}}</div>
    <div class="pw-stat-value{{if .Class}} {{.Class}}{{end}}">{{.Value}}</div>
  </div>{{end}}
</div>
<div class="rounded-2xl border border-border bg-surface-2/60 p-4">
  <div class="mb-2 text-[0.78rem] font-bold uppercase tracking-[0.08em] text-brand-soft">Detector State</div>
  <div class="pw-kv">{{range .Detector}}
    <div class="pw-k">{{.Key}}</div>
    <div class="pw-v{{if .Class}} {{.Class}}{{end}}">{{.Value}}</div>{{end}}
  </div>
</div>{{end}}
