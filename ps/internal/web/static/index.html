<div id="dashboard-state"></div>

<section class="pw-panel-grid">
  <div class="pw-panel">
    <div class="pw-panel-head">
      <div class="pw-panel-title">Traffic Trends</div>
      <div class="pw-panel-meta" id="traffic-panel-meta">Recent history</div>
    </div>
    <svg class="block h-[170px] w-full" id="traffic-chart" viewBox="0 0 640 140" preserveAspectRatio="none"></svg>
    <div class="chart-legend" id="traffic-legend"></div>
  </div>
  <div class="pw-panel">
    <div class="pw-panel-head">
      <div class="pw-panel-title">RF Pressure</div>
      <div class="pw-panel-meta" id="rf-panel-meta">Recent history</div>
    </div>
    <svg class="block h-[170px] w-full" id="rf-chart" viewBox="0 0 640 140" preserveAspectRatio="none"></svg>
    <div class="chart-legend" id="rf-legend"></div>
  </div>
</section>

<div id="dashboard-watchlist"></div>
<div id="dashboard-aircraft"></div>

<script>
(function () {
  "use strict";

  const REFRESH_INTERVAL_MS = 2000;
  const TREND_HISTORY_LIMIT = 90;
  const WATCHLIST_STORAGE_KEY = 'planeWatcher.beacons';
  const CHART_WIDTH = 640;
  const CHART_HEIGHT = 140;
  const CHART_VERTICAL_PAD = 5;
  const CHART_STROKE_WIDTH = 2.4;
  const CHART_GRID_STROKE = 'rgba(255,255,255,0.06)';
  const CHART_BG_FILL = 'rgba(255,255,255,0.01)';

  const SERIES_COLORS = {
    forwarded: '#f2b920',
    forwardedFill: 'rgba(242,185,32,0.10)',
    crcPass: '#5bd67a',
    drops: '#f44e4e',
    rawThr: '#f2b920',
    rawThrFill: 'rgba(242,185,32,0.10)',
    saturation: '#ff6b6b',
    nearRail: '#ffe25c',
  };

  const errorBanner = document.getElementById('error');
  const trafficMeta = document.getElementById('traffic-panel-meta');
  const rfMeta = document.getElementById('rf-panel-meta');
  const hoverBindings = new WeakSet();

  const trendHistory = [];
  let previousStats = null;

  // ---- watchlist (localStorage) ------------------------------------------

  function loadWatchlist() {
    try {
      return JSON.parse(localStorage.getItem(WATCHLIST_STORAGE_KEY) || '[]');
    } catch (err) {
      return [];
    }
  }

  function saveWatchlist(list) {
    localStorage.setItem(WATCHLIST_STORAGE_KEY, JSON.stringify(list));
  }

  function toggleBeacon(icao) {
    const set = new Set(loadWatchlist());
    if (set.has(icao)) {
      set.delete(icao);
    } else {
      set.add(icao);
    }
    saveWatchlist(Array.from(set).sort());
    refreshAircraft();
    refreshWatchlist();
  }

  function handleBeaconClick(event) {
    const button = event.target.closest('[data-action="toggle-beacon"]');
    if (!button) return;
    const icao = button.dataset.icao;
    if (icao) toggleBeacon(icao);
  }

  // ---- sparkline charts ---------------------------------------------------

  function pushTrend(point) {
    trendHistory.push(point);
    while (trendHistory.length > TREND_HISTORY_LIMIT) trendHistory.shift();
  }

  function buildSparklinePath(values, width, height) {
    if (values.length < 2) return '';
    const maxValue = Math.max.apply(null, values);
    const minValue = Math.min.apply(null, values);
    const span = Math.max(1, maxValue - minValue);
    const usableHeight = height - 2 * CHART_VERTICAL_PAD;
    return values.map(function (v, i) {
      const x = (i / (values.length - 1)) * width;
      const y = height - (((v - minValue) / span) * usableHeight + CHART_VERTICAL_PAD);
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }

  function renderLegend(legendId, series, hoverIndex) {
    const legend = document.getElementById(legendId);
    if (!legend) return;
    const pointCount = (series[0] && series[0].values && series[0].values.length) || 0;
    const safeIndex = hoverIndex == null
      ? pointCount - 1
      : Math.max(0, Math.min(pointCount - 1, hoverIndex));
    legend.innerHTML = series.map(function (s) {
      const value = safeIndex >= 0 ? s.values[safeIndex] : null;
      const formatted = value == null
        ? '—'
        : (s.format ? s.format(value) : value.toFixed(1));
      return '<div class="legend-item">' +
        '<span class="legend-swatch" style="background:' + s.color + '"></span>' +
        '<span class="legend-label">' + s.label + '</span>' +
        '<span class="legend-value">' + formatted + '</span>' +
        '</div>';
    }).join('');
  }

  function bindSparklineHover(svg, series, legendId) {
    if (hoverBindings.has(svg)) {
      renderLegend(legendId, series, null);
      return;
    }
    svg.addEventListener('mousemove', function (event) {
      const bounds = svg.getBoundingClientRect();
      if (!bounds.width) return;
      const ratio = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
      const pointCount = (series[0] && series[0].values && series[0].values.length) || 0;
      if (pointCount < 1) return;
      renderLegend(legendId, series, Math.round(ratio * (pointCount - 1)));
    });
    svg.addEventListener('mouseleave', function () {
      renderLegend(legendId, series, null);
    });
    hoverBindings.add(svg);
    renderLegend(legendId, series, null);
  }

  function renderSparkline(svgId, series, legendId) {
    const svg = document.getElementById(svgId);
    if (!svg) return;
    const grid = [0.25, 0.5, 0.75].map(function (frac) {
      const y = (CHART_HEIGHT * frac).toFixed(1);
      return '<line x1="0" y1="' + y + '" x2="' + CHART_WIDTH + '" y2="' + y +
        '" stroke="' + CHART_GRID_STROKE + '" stroke-width="1" />';
    }).join('');
    const paths = series.map(function (s) {
      const path = buildSparklinePath(s.values, CHART_WIDTH, CHART_HEIGHT);
      if (!path) return '';
      const fill = s.fill
        ? '<path d="' + path + ' L ' + CHART_WIDTH + ',' + CHART_HEIGHT +
          ' L 0,' + CHART_HEIGHT + ' Z" fill="' + s.fill + '" stroke="none" />'
        : '';
      return fill + '<path d="' + path + '" fill="none" stroke="' + s.color +
        '" stroke-width="' + CHART_STROKE_WIDTH +
        '" stroke-linecap="round" stroke-linejoin="round" />';
    }).join('');
    svg.innerHTML = '<rect x="0" y="0" width="' + CHART_WIDTH + '" height="' + CHART_HEIGHT +
      '" fill="' + CHART_BG_FILL + '" rx="8" />' + grid + paths;
    bindSparklineHover(svg, series, legendId);
  }

  function renderTrendCharts() {
    const msgRates = trendHistory.map(function (p) { return p.msgRate; });
    const crcRates = trendHistory.map(function (p) { return p.crcRate; });
    const dropRates = trendHistory.map(function (p) { return p.dropRate; });
    const rawThr = trendHistory.map(function (p) { return p.rawPowerThr; });
    const satRates = trendHistory.map(function (p) { return p.rawSatRate; });
    const nearRates = trendHistory.map(function (p) { return p.rawNearRate; });

    const perSecond = function (v) { return v.toFixed(1) + '/s'; };
    const perSecondInt = function (v) { return v.toFixed(0) + '/s'; };

    renderSparkline('traffic-chart', [
      { label: 'Forwarded', color: SERIES_COLORS.forwarded, fill: SERIES_COLORS.forwardedFill, values: msgRates, format: perSecond },
      { label: 'CRC Pass', color: SERIES_COLORS.crcPass, values: crcRates, format: perSecond },
      { label: 'Drops', color: SERIES_COLORS.drops, values: dropRates, format: perSecond },
    ], 'traffic-legend');

    renderSparkline('rf-chart', [
      { label: 'Raw Thr', color: SERIES_COLORS.rawThr, fill: SERIES_COLORS.rawThrFill, values: rawThr, format: perSecondInt },
      { label: 'Sat', color: SERIES_COLORS.saturation, values: satRates, format: perSecond },
      { label: 'Near Rail', color: SERIES_COLORS.nearRail, values: nearRates, format: perSecond },
    ], 'rf-legend');

    if (trendHistory.length) {
      const newest = trendHistory[trendHistory.length - 1];
      trafficMeta.textContent = 'Now ' + newest.msgRate.toFixed(1) + ' msg/s';
      rfMeta.textContent = 'Raw threshold ' + newest.rawPowerThr.toFixed(0) + '/s';
    }
  }

  // ---- fragment fetches ---------------------------------------------------

  async function refreshFragment(targetId, url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(url + ' HTTP ' + response.status);
    document.getElementById(targetId).innerHTML = await response.text();
  }

  function pinnedQuery() {
    const ids = loadWatchlist();
    return ids.length ? '?pinned=' + encodeURIComponent(ids.join(',')) : '';
  }

  function refreshState() {
    return refreshFragment('dashboard-state', '/partials/dashboard/state');
  }

  async function refreshAircraft() {
    try {
      await refreshFragment('dashboard-aircraft', '/partials/dashboard/aircraft' + pinnedQuery());
    } catch (err) {
      // Tolerate transient failures; the next tick will retry.
    }
  }

  async function refreshWatchlist() {
    try {
      await refreshFragment('dashboard-watchlist', '/partials/dashboard/watchlist' + pinnedQuery());
    } catch (err) {
      // Tolerate transient failures; the next tick will retry.
    }
  }

  async function refreshTrends() {
    const response = await fetch('/api/stats');
    if (!response.ok) throw new Error('/api/stats HTTP ' + response.status);
    const data = await response.json();
    const now = Date.now();
    const debug = data.debug || {};
    const rawPowerThr = debug.raw_power_thr_ct || 0;
    const rawNear = debug.raw_iq_nearrail_ct || 0;
    const rawSat = debug.raw_power_sat_ct || 0;
    const dt = previousStats ? Math.max(1, (now - previousStats.ts) / 1000) : 1;
    const dropRate = previousStats ? Math.max(0, (data.drop_count - previousStats.dropCount) / dt) : 0;
    const rawPowerThrRate = previousStats ? Math.max(0, (rawPowerThr - previousStats.rawPowerThr) / dt) : 0;
    const rawNearRate = previousStats ? Math.max(0, (rawNear - previousStats.rawNear) / dt) : 0;
    const rawSatRate = previousStats ? Math.max(0, (rawSat - previousStats.rawSat) / dt) : 0;

    pushTrend({
      msgRate: data.msg_rate || 0,
      crcRate: data.crc_pass_rate || 0,
      dropRate: dropRate,
      rawPowerThr: rawPowerThrRate,
      rawNearRate: rawNearRate,
      rawSatRate: rawSatRate,
    });
    renderTrendCharts();

    previousStats = {
      ts: now,
      dropCount: data.drop_count,
      rawPowerThr: rawPowerThr,
      rawNear: rawNear,
      rawSat: rawSat,
    };
  }

  async function tick() {
    try {
      await Promise.all([refreshState(), refreshAircraft(), refreshWatchlist(), refreshTrends()]);
      errorBanner.classList.add('hidden');
    } catch (err) {
      errorBanner.classList.remove('hidden');
      errorBanner.textContent = 'Connection lost: ' + err.message;
    }
  }

  document.addEventListener('click', handleBeaconClick);
  setInterval(tick, REFRESH_INTERVAL_MS);
  tick();
})();
</script>
