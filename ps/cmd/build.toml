# Per-command build metadata for `builder`.
#
# Schema:
#   [<command>]
#   targets = ["host", "arm"]   # subset of {"host","arm"}; default both
#   service = "S99<name>"       # optional, used by hot-swap restart map
#
# Commands without an entry default to targets = ["host", "arm"].

[beast-client]
targets = ["arm"]

[builder]
targets = ["host"]

[collect-stats]
targets = ["arm"]

[dump-capture]
targets = ["arm"]

[fifo-monitor]
targets = ["arm"]

[plane-feeder]
targets = ["arm"]
service = "S99plane-feeder"

[pps-check]
targets = ["arm"]

[regdump]
targets = ["arm"]

[regpeek]
targets = ["arm"]

[replay]
targets = ["host"]

[sweep-align]
targets = ["arm"]

[tune-detector]
targets = ["arm"]

[ubx]
targets = ["arm"]

[watch-stats]
targets = ["arm"]
